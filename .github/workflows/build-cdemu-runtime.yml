name: Build CDEmu private runtime

on:
  push:
    branches:
      - build-cdemu-runtime-20261007

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git gettext intltool \
            libglib2.0-dev libgcrypt20-dev libsamplerate0-dev libsndfile1-dev \
            liblzma-dev libbz2-dev zlib1g-dev libao-dev \
            python3 python3-gi libgtk-3-0 gir1.2-gtk-3.0 libnotify4 gir1.2-notify-0.7

      - name: Build libMirage 3.3.3 into private prefix
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/cdemu/cdemu.git cdemu
          cd cdemu
          git checkout --detach libmirage-3.3.3
          cmake -S libmirage -B ../build-libmirage -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/sdh-cdemu \
            -DGTKDOC_ENABLED=OFF \
            -DINTROSPECTION_ENABLED=OFF \
            -DVAPI_ENABLED=OFF \
            -DPOST_INSTALL_HOOKS=OFF
          cmake --build ../build-libmirage
          sudo cmake --install ../build-libmirage
          test -e /opt/sdh-cdemu/lib/libmirage.so.12
          test -d /opt/sdh-cdemu/lib/libmirage-3.3
          test "$(find /opt/sdh-cdemu/lib/libmirage-3.3 -type f | wc -l)" -ge 5
          strings /opt/sdh-cdemu/lib/libmirage.so.12 | grep -F '/opt/sdh-cdemu/lib/libmirage-3.3'

      - name: Build cdemu-daemon 3.3.1 into private prefix
        shell: bash
        run: |
          set -euo pipefail
          cd cdemu
          git checkout --detach cdemu-daemon-3.3.1
          PKG_CONFIG_PATH=/opt/sdh-cdemu/lib/pkgconfig cmake -S cdemu-daemon -B ../build-daemon -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/sdh-cdemu \
            -DCMAKE_INSTALL_RPATH=/opt/sdh-cdemu/lib \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON
          PKG_CONFIG_PATH=/opt/sdh-cdemu/lib/pkgconfig cmake --build ../build-daemon
          sudo cmake --install ../build-daemon
          test -x /opt/sdh-cdemu/bin/cdemu-daemon
          readelf -d /opt/sdh-cdemu/bin/cdemu-daemon | grep -F '/opt/sdh-cdemu/lib'

      - name: Install cdemu-client 3.3.1 and gCDEmu 3.3.1 scripts
        shell: bash
        run: |
          set -euo pipefail
          cd cdemu
          git checkout --detach cdemu-client-3.3.1
          sudo install -Dm755 cdemu-client/src/cdemu /opt/sdh-cdemu/bin/cdemu
          git checkout --detach gcdemu-3.3.1
          sudo install -Dm755 gcdemu/src/gcdemu /opt/sdh-cdemu/bin/gcdemu
          sudo install -Dm644 gcdemu/data/gcdemu-icon.svg /opt/sdh-cdemu/share/pixmaps/gcdemu-icon.svg
          /opt/sdh-cdemu/bin/cdemu --version | grep -F '3.3.1'

      - name: Verify ABI and runtime payload
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH=/opt/sdh-cdemu/lib
          file /opt/sdh-cdemu/bin/cdemu-daemon
          ldd /opt/sdh-cdemu/bin/cdemu-daemon | tee /tmp/ldd-daemon.txt
          ! grep -F 'not found' /tmp/ldd-daemon.txt
          find /opt/sdh-cdemu -type f -o -type l | sort | tee /tmp/runtime-files.txt
          max_glibc="$(
            { objdump -T /opt/sdh-cdemu/bin/cdemu-daemon; objdump -T /opt/sdh-cdemu/lib/libmirage.so.12; } |
            grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -n1
          )"
          echo "MAX_GLIBC=$max_glibc"
          python3 - <<'PY'
          import re, subprocess
          files=['/opt/sdh-cdemu/bin/cdemu-daemon','/opt/sdh-cdemu/lib/libmirage.so.12']
          versions=[]
          for p in files:
              s=subprocess.check_output(['objdump','-T',p], text=True, errors='replace')
              versions += [tuple(map(int,m.split('.'))) for m in re.findall(r'GLIBC_([0-9]+(?:\.[0-9]+)+)',s)]
          assert max(versions, default=(0,)) <= (2,39), max(versions)
          PY
          sudo bash -c 'printf "%s\n" "SDH_CDEMU_RUNTIME=1" "libMirage=3.3.3" "cdemu-daemon=3.3.1" "cdemu-client=3.3.1" "gCDEmu=3.3.1" > /opt/sdh-cdemu/SDH-RUNTIME-INFO'
          sudo bash -c 'cd /opt && tar -czf /tmp/sdh-cdemu-runtime-1.0.0.tar.gz sdh-cdemu'
          sha256sum /tmp/sdh-cdemu-runtime-1.0.0.tar.gz | tee /tmp/SHA256SUMS

      - name: Stage artifact
        run: |
          mkdir -p artifact
          cp /tmp/sdh-cdemu-runtime-1.0.0.tar.gz /tmp/SHA256SUMS /tmp/ldd-daemon.txt /tmp/runtime-files.txt artifact/

      - name: Upload runtime
        uses: actions/upload-artifact@v4
        with:
          name: sdh-cdemu-private-runtime-1.0.0
          path: artifact/
          if-no-files-found: error
          retention-days: 1
